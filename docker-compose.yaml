services:
  rest-api:
    build: ./RestAPI    
    depends_on:
      sql-database:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - Media:/var/media
      - ./db_root_password.txt:/run/secrets/db_root_password:ro
    environment:
      FLASK_RUN_HOST: "0.0.0.0"
      FLASK_RUN_PORT: 5000
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_HOST: sql-database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: video_streamer
      N_CONCURRENT_WORKERS: 4
    networks: 
      - backend

  sql-database:
    image: mysql
    restart: always
    volumes:
      - ./db_root_password.txt:/run/secrets/db_root_password:ro
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: video_streamer
    ports:
      - "3307:3306"
    networks: 
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  Media: {}

networks: 
  backend:
    external: true
      